[project]
name = "ytarchive"
version = "0.1.0"
description = "YouTube video archival tool for permanent preservation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click==8.5.0",
    "rich==15.0.0",
    "google-api-python-client==2.199.0",
    "google-auth-oauthlib==1.4.1",
    "google-auth-httplib2==0.4.2",
    "pydantic==2.13.5",
    "yt-dlp==2026.8.19",
]

[project.scripts]
ytarchive = "ytarchive.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=ytarchive --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]
