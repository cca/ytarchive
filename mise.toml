# mise configuration for ytarchive
# https://mise.jdx.dev/

[env]
CHANNEL = "UC3clbBht0DU9hCSKvoP-Z_Q"

[tools]
python = "3.12"
# Note: The tool auto-detects Node.js or Deno for JS runtime
# If you get JS runtime warnings, install Deno:
# curl -fsSL https://deno.land/install.sh | sh

[tasks.setup]
description = "Setup project dependencies"
run = [
  "uv sync --extra dev",
  "echo 'Checking for ffmpeg...'",
  "command -v ffmpeg || echo 'WARNING: ffmpeg not found. Install with: brew install ffmpeg'",
  "echo 'Checking for Deno (recommended for yt-dlp)...'",
  "command -v deno || echo 'OPTIONAL: Install Deno for better yt-dlp compatibility: curl -fsSL https://deno.land/install.sh | sh'",
]

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.lint]
description = "Run linting"
run = "uv run ruff check ."

[tasks.format]
description = "Format code"
run = "uv run ruff format ."
